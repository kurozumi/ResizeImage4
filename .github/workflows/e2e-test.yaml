name: E2E test for EC-CUBE4 Plugin
on: [workflow_dispatch, pull_request]
env:
  WORKING_DIRECTORY: 'ec-cube'
jobs:
  selenium:
    name: Selenium
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eccube-versions: ['4.2', '4.3']
        php-versions: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]
        exclude:
          - eccube-versions: 4.2
            php-versions: 8.2
          - eccube-versions: 4.2
            php-versions: 8.3
          - eccube-versions: 4.3
            php-versions: 7.4
          - eccube-versions: 4.3
            php-versions: 8.0

    steps:
      - name: Checkout EC-CUBE
        uses: actions/checkout@v4
        with:
          repository: EC-CUBE/ec-cube
          ref: ${{ matrix.eccube-versions }}
          path: ${{ env.WORKING_DIRECTORY }}

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@master #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php-versions }}
          extensions: mbstring, xml, ctype, iconv, mysql, intl, :xdebug
          tools: composer:v2

      - name: Checkout
        uses: actions/checkout@v2
        with:
          path: ${{ env.WORKING_DIRECTORY }}/app/Plugin/${{ github.event.repository.name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Initialize Composer
        uses: ./.github/actions/composer

      - name: Setup EC-CUBE and Plugin
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          bin/console e:i
          bin/console eccube:plugin:install --code ${{ github.event.repository.name }}
          bin/console eccube:plugin:enable --code ${{ github.event.repository.name }}

      - name: Start PHP Development Server
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: php -S localhost:8000 &

      - name: Set up Python 3.7
        uses: actions/setup-python@v2
        with:
          python-version: '3.7'

      - name: Install Python dependencies
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cd app/Plugin/${{ github.event.repository.name }}
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: E2E Test
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: |
          cd app/Plugin/${{ github.event.repository.name }}/selenium
          python -m unittest discover -v
